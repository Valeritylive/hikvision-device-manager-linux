name: Build AppImage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install AppImage host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file wget libfuse2
      - name: Build AppImage
        run: bash build-appimage.sh
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: HikvisionDeviceManager-x86_64-AppImage
          path: dist/HikvisionDeviceManager-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30
